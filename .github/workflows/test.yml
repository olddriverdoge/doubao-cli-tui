name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装测试依赖
        run: python -m pip install --upgrade pip pexpect
      - name: 语法检查
        run: python -m py_compile doubao_tui.py tests/mock_doubao.py tests/test_tui.py
      - name: 端到端测试（mock 后端，无需登录）
        run: python tests/test_tui.py
      - name: 自检命令可执行
        run: |
          mkdir -p "$RUNNER_TEMP/conf/doubao-tui"
          printf '{"bin":"%s","profile":"mock","workspace":"%s","mode":"work","permission":"ask_risky","timeout":30}' \
            "$GITHUB_WORKSPACE/tests/mock_doubao.py" "$RUNNER_TEMP" > "$RUNNER_TEMP/conf/doubao-tui/config.json"
          XDG_CONFIG_HOME="$RUNNER_TEMP/conf" python doubao_tui.py --doctor
